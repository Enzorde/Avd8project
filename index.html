<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Data e Hora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-100 flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded-lg shadow-lg text-center">
    <h1 class="text-2xl font-bold mb-4">Data e Hora Atual</h1>
    <p id="datetime" class="text-lg">Carregando...</p>
    <button onclick="fetchDateTime()" class="mt-4 bg-pink-500 text-white px-4 py-2 rounded hover:bg-blue-600">
      Atualizar
    </button>
  </div>

  <script>
    async function fetchDateTime() {
      try {
        const response = await fetch('https://atividade8dw.onrender.com');
        const data = await response.json();
        document.getElementById('datetime').textContent = `${data.date}`;
      } catch (error) {
        document.getElementById('datetime').textContent = 'Erro ao carregar data e hora';
        console.error('Erro:', error);
      }
    }

    // Carrega a data e hora ao iniciar
    fetchDateTime();
  </script>
</body>
</html>
